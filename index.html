<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b6b43" />
  <meta name="description" content="UGREEN LAB — 유그린 제작. 웹서비스와 데스크톱 도구 개발 및 개선." />
  <title>UGREEN LAB</title>
  <style>
    :root{
      --bg:#f6f7f1;
      --ink:#10231b;
      --muted:#6c7972;
      --line:rgba(16,35,27,.10);
      --green:#0b6b43;
      --green-soft:#66ad49;
      --card:rgba(255,255,255,.76);
      --shadow:0 24px 80px rgba(17,62,43,.09);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      background:var(--bg);
      font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      overflow-x:hidden;
      letter-spacing:-.02em;
    }
    body::before,body::after{
      content:"";
      position:fixed;
      z-index:-2;
      border-radius:50%;
      pointer-events:none;
      filter:blur(18px);
      opacity:.58;
    }
    body::before{
      width:46vw;height:46vw;min-width:440px;min-height:440px;
      right:-17vw;top:-15vw;
      background:radial-gradient(circle at 40% 40%,rgba(110,182,73,.27),rgba(110,182,73,0) 70%);
      animation:floatA 14s ease-in-out infinite alternate;
    }
    body::after{
      width:38vw;height:38vw;min-width:360px;min-height:360px;
      left:-15vw;bottom:-15vw;
      background:radial-gradient(circle at 55% 45%,rgba(11,107,67,.17),rgba(11,107,67,0) 72%);
      animation:floatB 16s ease-in-out infinite alternate;
    }
    .grain{
      position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.22;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");
    }
    .wrap{width:min(1080px,calc(100% - 40px));margin:0 auto}
    .topbar{
      height:82px;display:flex;align-items:center;justify-content:space-between;
      opacity:0;transform:translateY(-12px);animation:reveal .7s .05s ease forwards;
    }
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;font-weight:850;letter-spacing:.06em}
    .brand img{
      width:42px;height:42px;border-radius:50%;object-fit:cover;
      box-shadow:0 10px 28px rgba(11,107,67,.16);
      animation:breathe 4.8s ease-in-out infinite;
    }
    .brand span{font-size:15px}
    
    .hero{
      min-height:610px;padding:82px 0 96px;
      display:grid;grid-template-columns:1.18fr .82fr;gap:64px;align-items:center;
    }
    .hero-copy{opacity:0;transform:translateY(28px);animation:reveal .85s .18s cubic-bezier(.2,.75,.25,1) forwards;padding-top:10px}
    .eyebrow{margin:0 0 20px;color:var(--green);font-size:13px;font-weight:900;letter-spacing:.16em}
    h1{
      margin:0 0 30px;font-size:clamp(62px,9.2vw,112px);line-height:.88;
      letter-spacing:-.07em;font-weight:900;
    }
    .hero-text{
      margin:0;font-size:clamp(19px,2.1vw,26px);line-height:1.58;color:#31463c;
    }
    .hero-text strong{color:var(--ink)}
    .hero-logo{
      justify-self:end;width:min(340px,39vw);aspect-ratio:1;border-radius:50%;
      padding:14px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.88);
      box-shadow:var(--shadow);backdrop-filter:blur(20px);position:relative;
      opacity:0;transform:scale(.9) rotate(-3deg);
      animation:logoIn .95s .34s cubic-bezier(.17,.86,.32,1.15) forwards;
    }
    .hero-logo img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
    .hero-logo::after{
      content:"";position:absolute;inset:-12px;border-radius:50%;
      border:1px solid rgba(11,107,67,.16);animation:ring 4s ease-in-out infinite;
    }

    .section{padding:22px 0 84px}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
    .section-head h2{margin:0;font-size:clamp(30px,4vw,46px);letter-spacing:-.05em}

    .service-card{
      --x:70%;--y:20%;
      position:relative;overflow:hidden;display:grid;grid-template-columns:82px 1fr auto;
      align-items:center;gap:24px;padding:34px;border-radius:28px;
      border:1px solid rgba(13,77,51,.10);background:var(--card);backdrop-filter:blur(18px);
      box-shadow:0 18px 60px rgba(18,61,43,.07);
      opacity:0;transform:translateY(26px);
      transition:transform .34s cubic-bezier(.2,.8,.2,1),box-shadow .34s ease,border-color .34s ease;
    }
    .service-card.visible{animation:cardIn .72s cubic-bezier(.2,.8,.2,1) forwards}
    .service-card::before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
      background:radial-gradient(360px circle at var(--x) var(--y),rgba(102,173,73,.14),transparent 58%);
      transition:opacity .3s ease;
    }
    .service-card:hover{transform:translateY(-6px);box-shadow:0 30px 86px rgba(15,76,50,.13);border-color:rgba(13,107,67,.22)}
    .service-card:hover::before{opacity:1}
    .num{
      width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
      color:var(--green);font-size:18px;font-weight:900;background:#eef5eb;border:1px solid rgba(11,107,67,.10)
    }
    .meta{display:flex;align-items:center;gap:10px;margin-bottom:9px}
    .meta strong{font-size:14px;color:var(--green)}
    .badge{font-size:11px;letter-spacing:.06em;color:#60726a;border:1px solid var(--line);padding:5px 8px;border-radius:999px}
    .service-card h3{margin:0 0 8px;font-size:clamp(27px,3.2vw,39px);letter-spacing:-.05em}
    .service-card p{margin:0;color:var(--muted);font-size:16px;line-height:1.68}
    .go{
      position:relative;z-index:2;display:inline-flex;align-items:center;gap:9px;
      padding:13px 17px;border:0;border-radius:14px;background:var(--ink);color:#fff;
      font:inherit;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap;
      transition:transform .25s ease,background .25s ease;
    }
    .go:hover{background:var(--green);transform:translateX(3px)}
    .go .arrow{transition:transform .25s ease}.go:hover .arrow{transform:translateX(3px)}

    .site-footer{
      width:100%;
      border-top:1px solid var(--line);
      padding:28px 0 34px;
      color:#748078;
      font-size:12px;
    }
    .footer-inner{
      width:min(1080px,calc(100% - 40px));
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }
    .footer-copy{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .footer-copy a{color:var(--green);font-weight:700;text-decoration:none}
    .footer-copy a:hover{text-decoration:underline}
    .footer-dot{opacity:.6}
    .copyright{white-space:nowrap;color:#748078}


    .toast{
      position:fixed;left:50%;bottom:28px;z-index:30;pointer-events:none;
      transform:translate(-50%,18px);opacity:0;padding:13px 18px;border-radius:14px;
      background:#10231b;color:#fff;font-size:13px;box-shadow:0 16px 50px rgba(0,0,0,.18);
      transition:.3s ease;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @keyframes reveal{to{opacity:1;transform:none}}
    @keyframes logoIn{to{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes cardIn{to{opacity:1;transform:none}}
    @keyframes breathe{50%{transform:scale(1.045)}}
    @keyframes ring{50%{transform:scale(1.04);opacity:.42}}
    @keyframes floatA{to{transform:translate(-5vw,5vh) scale(1.08)}}
    @keyframes floatB{to{transform:translate(6vw,-4vh) scale(.94)}}

    @media(max-width:780px){
      .wrap{width:min(100% - 28px,1080px)}
      .topbar{height:70px}

      /* 데스크톱 구도를 그대로 축소: 타이틀 왼쪽, 로고 오른쪽 */
      .hero{
        grid-template-columns:minmax(0,1fr) clamp(132px,31vw,172px);
        min-height:auto;
        padding:54px 0 70px;
        gap:clamp(18px,4vw,30px);
        align-items:center;
        justify-content:stretch;
      }
      .hero-copy{
        grid-column:1;
        grid-row:1;
        padding-top:0;
        min-width:0;
        align-self:center;
      }
      .hero-logo{
        order:0;
        grid-column:2;
        grid-row:1;
        justify-self:end;
        width:100%;
        max-width:172px;
      }
      h1{
        font-size:clamp(36px,10vw,50px);
        line-height:.9;
        margin-bottom:16px;
      }
      .hero-text{
        font-size:clamp(13px,3.1vw,15px);
        line-height:1.5;
        max-width:100%;
      }

      .section{padding-bottom:60px}
      .section-head{align-items:flex-start;flex-direction:column;gap:5px}
      .service-card{grid-template-columns:56px 1fr;padding:24px;gap:16px;border-radius:22px}
      .num{width:52px;height:52px;border-radius:16px}
      .go{grid-column:1/-1;justify-content:center;margin-top:5px}
      .footer-inner{
        width:min(100% - 28px,1080px);
        align-items:flex-start;
        flex-direction:column;
        gap:8px;
      }
    }

    @media(max-width:390px){
      .hero{
        grid-template-columns:minmax(0,1fr) 118px;
        gap:14px;
      }
      .hero-logo{max-width:118px}
      h1{font-size:clamp(31px,9.7vw,40px)}
      .hero-text{font-size:12.5px}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
      .topbar,.hero-copy,.hero-logo,.service-card{opacity:1!important;transform:none!important}
    }
  </style>
</head>

  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    // 링크가 확정되면 아래 두 값만 입력하면 됩니다.
    const LINKS = {
      youthgrant: "https://youthgrant.seoeum1711.workers.dev",
      attendance: ""
    };

    const cards = [...document.querySelectorAll(".service-card")];

    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
          observer.unobserve(entry.target);
        }
      }
    }, { threshold: 0.18 });

    cards.forEach(card => observer.observe(card));

    cards.forEach(card => {
      card.addEventListener("pointermove", (event) => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty("--x", `${event.clientX - rect.left}px`);
        card.style.setProperty("--y", `${event.clientY - rect.top}px`);
      });
    });

    const toast = document.querySelector(".toast");
    let toastTimer;

    function openLink(url, label) {
      if (url) {
        window.open(url, "_blank", "noopener,noreferrer");
        return;
      }
      clearTimeout(toastTimer);
      toast.textContent = label === "출석부 도와줘"
        ? "출석부 도와줘 상세 페이지 준비중입니다."
        : `${label} 링크는 주소가 확정되면 바로 연결됩니다.`;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
    }

    const buttons = document.querySelectorAll(".pending");
    buttons[0].addEventListener("click", () => openLink(LINKS.youthgrant, "YouthGrant"));
    buttons[1].addEventListener("click", () => openLink(LINKS.attendance, "출석부 도와줘"));
  </script>
